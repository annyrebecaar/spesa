<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240">
  <title>Spesa: símbolo (cesta com etiqueta)</title>
  <rect width="120" height="120" rx="28" fill="#1F4A3A"/>
  <!-- alças -->
  <path d="M42 46 L56 24 L61 27 L48 46 Z M90 46 L76 24 L71 27 L84 46 Z" fill="#F6F4EE"/>
  <!-- corpo da cesta -->
  <path d="M30 48 H102 L96 88 Q95 94 89 94 H43 Q37 94 36 88 Z" fill="#F6F4EE"/>
  <!-- frisos -->
  <path d="M50 58 V84 M66 58 V84 M82 58 V84" stroke="#1F4A3A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- cordinha da etiqueta -->
  <path d="M33 50 Q24 56 22 66" stroke="#F6F4EE" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- etiqueta pendurada à esquerda -->
  <g transform="rotate(-20 22 80)">
    <path d="M22 66 L34 74 V92 Q34 96 30 96 H14 Q10 96 10 92 V74 Z" fill="#B23A33"/>
    <circle cx="22" cy="75" r="2.6" fill="#F6F4EE"/>
  </g>
</svg>
